<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnosis Room · Evaluation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
  :root { --ink: #22303C; --paper: #F6F1E7; --frame: #1B2733; --frame-2: #15202B; --frame-3: #22303C; --line: #2A3A49; --line-2: #3A4C5E; --muted: #9FB3C8; --accent: #B5E48C; --teal: #2A9D8F; --gold: #E9C46A; --orange: #F4A261; --pat: #E76F51; --claude: #7C3AED; --blue: #4C8DFF; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Nunito', sans-serif; color: var(--paper); background: var(--frame); min-height: 100vh; }
  header { display: flex; align-items: center; gap: 20px; padding: 0 24px; height: 64px; background: var(--frame-2); border-bottom: 2px solid var(--line); }
  header .logo { font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800; }
  header a { color: var(--muted); font-weight: 700; text-decoration: none; }
  header a:hover { color: var(--paper); }
  main { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; padding: 20px 24px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--frame-3); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h2 { margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 18px; }
  h3 { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 1px; color: var(--muted); }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--muted); }
  select, input { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line-2); background: var(--frame); color: var(--paper); }
  button { font: inherit; font-weight: 800; font-size: 14px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line-2); background: transparent; color: var(--paper); cursor: pointer; }
  button.accent { background: var(--accent); color: #0F1A14; border-color: var(--accent); }
  button.small { font-size: 12px; padding: 6px 10px; border-radius: 8px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .tabs { display: flex; gap: 6px; }
  .tab { font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 8px; border: 2px solid var(--line-2); background: transparent; color: var(--muted); }
  .tab.on { background: var(--line-2); color: var(--paper); }
  .runs { display: flex; flex-direction: column; gap: 6px; max-height: 48vh; overflow: auto; }
  .run { padding: 10px 12px; border-radius: 10px; background: var(--frame); cursor: pointer; display: flex; flex-direction: column; gap: 2px; border: 2px solid transparent; }
  .run.on { border-color: var(--accent); }
  .run .t { font-weight: 700; font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .run .s { font-size: 12px; color: var(--muted); }
  .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 999px; background: var(--line-2); color: var(--paper); white-space: nowrap; }
  .tag.claude { background: var(--claude); } .tag.running { background: var(--gold); color: #0F1A14; } .tag.failed { background: var(--pat); } .tag.shift { background: var(--teal); color: #0F1A14; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { padding: 12px; border-radius: 12px; background: var(--frame); display: flex; flex-direction: column; gap: 2px; }
  .tile .v { font-family: 'Baloo 2', sans-serif; font-size: 28px; font-weight: 800; }
  .tile .v.accent { color: var(--accent); } .tile .v.warn { color: var(--orange); }
  .tile .l { font-size: 10px; font-weight: 800; letter-spacing: .5px; color: var(--muted); }
  .tile .d { font-size: 11px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1300px) { .grid2 { grid-template-columns: 1fr; } }
  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bar { display: grid; grid-template-columns: 200px 1fr 70px; gap: 10px; align-items: center; font-size: 13px; }
  .bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { height: 14px; border-radius: 4px; background: var(--frame); overflow: hidden; }
  .bar .track i { display: block; height: 100%; background: var(--teal); border-radius: 0 4px 4px 0; }
  .bar .n { color: var(--muted); font-weight: 700; text-align: right; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; letter-spacing: .5px; color: var(--muted); }
  tr.case { cursor: pointer; } tr.case:hover { background: var(--frame); }
  td.win { color: var(--accent); font-weight: 800; }
  .ok { color: var(--accent); font-weight: 800; } .bad { color: var(--pat); font-weight: 800; } .warn { color: var(--gold); font-weight: 800; }
  .muted { color: var(--muted); }
  .err { color: var(--orange); font-size: 12px; font-weight: 700; min-height: 14px; }
  dialog { border: 0; border-radius: 16px; padding: 0; background: var(--frame-3); color: var(--paper); width: 760px; max-width: 94vw; max-height: 88vh; }
  dialog::backdrop { background: rgba(10,16,22,.7); }
  dialog .in { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; max-height: 88vh; overflow: auto; }
  .tr { padding: 8px 10px; border-radius: 10px; background: var(--frame); font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
  .tr .k { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--muted); }
  .tr .why { font-size: 12px; color: #C9B6FF; font-style: italic; }
  .tr .think { margin-top: 4px; }
  .tr .think summary { font-size: 11px; font-weight: 700; letter-spacing: .3px; color: #9B82D8; cursor: pointer; list-style: none; }
  .tr .think summary::-webkit-details-marker { display: none; }
  .tr .think summary::before { content: '▸ '; }
  .tr .think[open] summary::before { content: '▾ '; }
  .tr .think .body { margin-top: 5px; font-size: 12px; line-height: 1.5; color: var(--muted); white-space: pre-wrap; padding-left: 10px; border-left: 2px solid var(--line); }
  .verdict { padding: 10px 12px; border-radius: 10px; background: var(--frame); border-left: 4px solid var(--accent); font-weight: 700; font-size: 13px; }
  .verdict.bad { border-color: var(--pat); } .verdict.warn { border-color: var(--gold); }
  .legend { font-size: 11px; color: var(--muted); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cmpbar { display: grid; grid-template-columns: 220px 1fr 1fr; gap: 10px; align-items: center; font-size: 13px; }
  .cmpbar .track { height: 12px; border-radius: 4px; background: var(--frame); overflow: hidden; }
  .cmpbar .track i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
  .cmpbar .a i { background: var(--claude); } .cmpbar .b i { background: var(--teal); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <div class="logo">DIAGNOSIS ROOM · EVALUATION</div>
  <a href="/">← back to the game</a>
  <span style="flex:1"></span>
  <span class="muted" id="meta">loading…</span>
</header>
<main>
  <aside class="panel">
    <h2>New run</h2>
    <label>DOCTOR<select id="doctor"><option value="claude">Claude (model)</option><option value="baseline">Rule-based baseline (offline)</option></select></label>
    <label>MODEL<select id="model"></select></label>
    <label>DIFFICULTY PRESET<select id="preset"></select></label>
    <div class="legend" id="presetDesc"></div>
    <label>ROLLOUTS (CASES, OR DAYS FOR A CLINIC PRESET)<input id="n" type="number" min="1" max="500" value="20"></label>
    <label>SEED (SAME SEED = SAME PATIENTS, FOR A FAIR COMPARISON)<input id="seed" type="number" placeholder="random"></label>
    <button class="accent" id="start">Start run</button>
    <div class="err" id="err"></div>
    <h3>RUNS</h3>
    <div class="runs" id="runs"></div>
  </aside>
  <section class="panel">
    <div class="tabs"><button class="tab on" data-view="run">Run detail</button><button class="tab" data-view="compare">Compare two runs</button></div>
    <div id="detail"><p class="muted">Pick a run on the left, or start one.</p></div>
    <div id="compareView" style="display:none">
      <div class="pair">
        <label>RUN A<select id="cmpA"></select></label>
        <label>RUN B<select id="cmpB"></select></label>
      </div>
      <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
        <button class="accent" id="doCompare">Compare</button>
        <button id="exportHtml" disabled>Export report (HTML)</button>
        <button id="exportJson" disabled>Export data (JSON)</button>
        <span class="err" id="cmpErr"></span>
      </div>
      <div id="cmpOut" style="margin-top:12px"></div>
    </div>
  </section>
</main>
<dialog id="caseDialog"><div class="in" id="caseBody"></div></dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (x) => x == null ? '—' : `${Math.round(x * 100)}%`;
const num = (x, d = 1) => x == null ? '—' : Number(x).toFixed(d);
let S = { presets: [], runs: [], selected: null, detail: null, claude: false, cmp: null };

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}

async function init() {
  const meta = await api('/api/meta');
  S.presets = meta.presets; S.claude = meta.claude_available;
  $('meta').textContent = `${meta.situations.length} situations · ${meta.cases} case variants · Claude: ${meta.claude_available ? 'ready' : 'off'}`;
  $('model').innerHTML = meta.claude_models.map(m => `<option value="${m}">${m}</option>`).join('');
  $('model').value = meta.default_model;
  $('preset').innerHTML = S.presets.map(p => `<option value="${p.name}">${p.name} · ${p.mode === 'shift' ? `${p.shift.patients} patients / ${p.shift.day_minutes} min` : (p.show_prices ? 'prices shown' : 'prices hidden') + (p.case_pool === 'traps' ? ', traps only' : '')}</option>`).join('');
  $('preset').value = 'standard';
  describePreset();
  if (!S.claude) { $('doctor').value = 'baseline'; $('doctor').querySelector('[value=claude]').disabled = true; $('err').textContent = meta.claude_error; }
  $('doctor').onchange = () => { $('model').disabled = $('doctor').value !== 'claude'; };
  $('doctor').onchange();
  await refresh();
  setInterval(refresh, 4000);
}

function describePreset() {
  const p = S.presets.find(p => p.name === $('preset').value);
  $('presetDesc').textContent = p ? p.description : '';
}

function runLabel(r) {
  return `${r.doctor === 'claude' ? r.model : 'baseline'} · ${r.preset} · ${r.done}/${r.n}${r.config.seed != null ? ' · seed ' + r.config.seed : ''}`;
}

async function refresh() {
  S.runs = await api('/api/eval/runs');
  $('runs').innerHTML = S.runs.map(r => `<div class="run ${r.id === S.selected ? 'on' : ''}" data-id="${r.id}">
    <div class="t"><span class="tag ${r.doctor === 'claude' ? 'claude' : ''}">${r.doctor === 'claude' ? esc(r.model) : 'baseline'}</span><span>${r.preset}</span>${r.mode === 'shift' ? '<span class="tag shift">clinic day</span>' : ''}<span class="tag ${r.status}">${r.status}</span></div>
    <div class="s">${r.done}/${r.n} rollouts · ${r.mode === 'shift' ? `day score ${num(r.summary.day?.day_score, 2)} · earnings ${r.summary.day?.earnings ?? '—'}` : `correct ${pct(r.summary.top1)} · clean ${pct(r.summary.clean)} · score ${num(r.summary.score, 2)}`} · ${new Date(r.started * 1000).toLocaleString()}</div></div>`).join('') || '<p class="muted">No runs yet.</p>';
  const opts = S.runs.map(r => `<option value="${r.id}">${esc(runLabel(r))}</option>`).join('');
  for (const id of ['cmpA', 'cmpB']) { const prev = $(id).value; $(id).innerHTML = opts; if (prev) $(id).value = prev; }
  const sel = S.runs.find(r => r.id === S.selected);
  if (sel && (sel.status === 'running' || !S.detail || S.detail.id !== sel.id || S.detail.done !== sel.done)) await showRun(S.selected);
}

const tile = (v, l, dsc, cls = '') => `<div class="tile"><div class="v ${cls}">${v}</div><div class="l">${l}</div>${dsc ? `<div class="d">${dsc}</div>` : ''}</div>`;

async function showRun(id) {
  S.selected = id;
  const r = await api(`/api/eval/runs/${id}`); S.detail = r;
  const s = r.summary, d = r.config;
  if (!s.n && !s.day) { $('detail').innerHTML = `<h2>Run ${id}</h2><p class="muted">${r.status === 'running' ? 'Waiting for the first rollout…' : 'Nothing recorded.'} ${r.error ? '<br>' + esc(r.error) : ''}</p>`; return; }
  const head = `
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <h2>Run ${id}</h2><span class="tag ${r.doctor === 'claude' ? 'claude' : ''}">${r.doctor === 'claude' ? esc(r.model) : 'baseline'}</span><span class="tag">${r.preset}</span>${r.mode === 'shift' ? '<span class="tag shift">clinic day</span>' : ''}<span class="tag ${r.status}">${r.status} · ${r.done}/${r.n}</span>
      <span class="muted" style="font-size:12px">board hidden · prices ${d.show_prices ? 'shown' : 'hidden'} · pool ${d.case_pool}${d.seed != null ? ' · seed ' + d.seed : ''}</span>
    </div>${r.error ? `<div class="err">${esc(r.error)}</div>` : ''}`;
  const day = s.day ? `
    <h3>THE DAY</h3>
    <div class="tiles">
      ${tile(num(s.day.day_score, 2), 'DAY SCORE', '0 = every patient wrong, 1 = every patient right', 'accent')}
      ${tile((s.day.earnings >= 0 ? '+' : '') + num(s.day.earnings, 0), 'EARNINGS / DAY', `of a possible ${num(s.day.best_possible, 0)} · $${num(s.day.test_spend, 0)} on tests`)}
      ${tile(num(s.day.seen_per_day) + ' / ' + num(s.day.patients_per_day, 0), 'PATIENTS SEEN', 'per day')}
      ${tile(num(s.day.correct_per_day), 'CORRECT / DAY', '')}
      ${tile(num(s.day.wrong_per_day), 'WRONG / DAY', '', s.day.wrong_per_day > 1 ? 'warn' : '')}
      ${tile(num(s.day.referred_per_day), 'REFERRED / DAY', 'declared undeterminable')}
      ${tile(num(s.day.unseen_per_day), 'LEFT UNSEEN / DAY', `${num(s.day.urgent_unseen_per_day)} urgent`, s.day.urgent_unseen_per_day > 0 ? 'warn' : '')}
      ${tile(num(s.day.minutes_used, 0) + ' min', 'TIME USED', `${pct(s.day.ran_out_of_time_rate)} of days ran out`)}
    </div>` : '';
  const cases = s.n ? `
    <h3>${s.day ? 'PATIENTS SEEN · OUTCOME' : 'OUTCOME'}</h3>
    <div class="tiles">
      ${tile(pct(s.top1), 'CORRECT DIAGNOSIS', 'named the true condition', 'accent')}
      ${tile(pct(s.clean), 'CORRECT AND CLEAN', 'right answer, dangerous causes excluded, no shortcut', 'accent')}
      ${tile(pct(s.safe_closure), 'SAFE CLOSURE', 'every must-not-miss excluded or the truth confirmed')}
      ${tile(num(s.score, 2), 'MEAN SCORE', '0.5 outcome + 0.3 process + 0.2 cost')}
      ${tile(num(s.process_score, 2), 'PROCESS SCORE', '0.5 eliminations + 0.3 differential + 0.2 timing, minus penalties')}
      ${tile(pct(s.missed_dangerous_rate), 'MISSED A DANGEROUS CAUSE', 'truth was must-not-miss and was not named', s.missed_dangerous_rate > 0 ? 'warn' : '')}
    </div>
    <h3>THE DIFFERENTIAL THE DOCTOR BUILT</h3>
    <div class="tiles">
      ${tile(pct(s.differential_recall), 'DANGEROUS CAUSES CONSIDERED', 'share of must-not-miss conditions the doctor named', 'accent')}
      ${tile(pct(s.truth_considered_rate), 'TRUTH WAS ON THE LIST', 'the real condition came up at some point')}
      ${tile(pct(s.never_considered_rate), 'A DANGEROUS CAUSE NEVER CAME UP', 'cases with at least one must-not-miss never named', s.never_considered_rate > 0 ? 'warn' : '')}
      ${tile(pct(s.differential_first_rate), 'DIFFERENTIAL BEFORE TESTS', 'first proposal came before any paid test')}
      ${tile(num(s.hypotheses_per_case), 'HYPOTHESES / CASE', `${num(s.off_board_per_case)} not on the hidden board`)}
      ${tile(pct(s.no_differential_rate), 'NEVER PROPOSED ANYTHING', 'went straight to tests or a diagnosis', s.no_differential_rate > 0 ? 'warn' : '')}
    </div>
    <h3>ELIMINATIONS, GATE, ORDERING</h3>
    <div class="tiles">
      ${tile(pct(s.shortcut_rate), 'USED A SHORTCUT', 'eliminated on something the guideline says not to rely on', s.shortcut_rate > 0 ? 'warn' : '')}
      ${tile(pct(s.unsupported_rate), 'UNSUPPORTED ELIMINATION', 'crossed off with no rule satisfied', s.unsupported_rate > 0 ? 'warn' : '')}
      ${tile(pct(s.valid_elimination_share), 'VALID ELIMINATIONS', 'share of all eliminations that satisfied a rule')}
      ${tile(pct(s.mnm_cleared_share), 'DANGEROUS CAUSES CLEARED', 'share of must-not-miss hypotheses validly eliminated')}
      ${tile(pct(s.truth_eliminated_rate), 'CROSSED OFF THE TRUTH', '', s.truth_eliminated_rate > 0 ? 'warn' : '')}
      ${tile(s.gate_missed_rate == null ? '—' : pct(s.gate_missed_rate), 'UNSTABLE NOT ESCALATED', 'among unstable patients', s.gate_missed_rate > 0 ? 'warn' : '')}
      ${tile(pct(s.false_escalation_rate), 'FALSE ESCALATION', 'stable patient escalated')}
      ${tile(num(s.order_violations_per_case), 'ORDERING VIOLATIONS / CASE', 'e.g. D-dimer at high probability, CT before hCG', s.order_violations_per_case > 0 ? 'warn' : '')}
      ${tile(num(s.unnecessary_tests_per_case), 'TESTS THAT COULD NOT CHANGE THE BOARD', 'per case', s.unnecessary_tests_per_case > 0.5 ? 'warn' : '')}
      ${tile(pct(s.abstain_rate), 'DECLARED UNDETERMINABLE', '')}
      ${tile(pct(s.timeout_rate), 'CLOSED WITHOUT A DIAGNOSIS', 'budget, step limit or doctor error', s.timeout_rate > 0 ? 'warn' : '')}
      ${tile(num(s.illegal_moves_per_case), 'ILLEGAL MOVES / CASE', 'rejected actions')}
    </div>
    <h3>SPEND</h3>
    <div class="tiles">
      ${tile('$' + num(s.spend, 0), 'SPEND / CASE', `cheapest safe route $${num(s.reference_cost, 0)}`)}
      ${tile(num(s.overspend_ratio, 2) + '×', 'SPEND VS SAFE ROUTE', '1.0 = as cheap as the guideline', s.overspend_ratio > 2 ? 'warn' : '')}
      ${tile(pct(s.cost_efficiency), 'COST EFFICIENCY', '')}
      ${tile(num(s.tests_per_case), 'TESTS / CASE', `${num(s.minutes, 0)} min per case`)}
      ${tile(s.errors, 'DOCTOR ERRORS', 'calls that failed')}
      ${tile('$' + num(s.cost_usd, 2), 'MODEL COST', `${(s.tokens.input_tokens || 0).toLocaleString()} in · ${(s.tokens.output_tokens || 0).toLocaleString()} out · ${(s.tokens.cache_read_input_tokens || 0).toLocaleString()} cached`)}
    </div>
    <div class="grid2">
      <div>
        <h3>CLEAN RATE BY SITUATION (WORST FIRST)</h3>
        <div class="bars">${s.by_situation.map(c => `<div class="bar" title="${esc(c.situation)}: correct ${c.correct}/${c.n}, clean ${c.safe}/${c.n}"><span class="lbl">${esc(c.situation)}</span><span class="track"><i style="width:${c.clean_rate * 100}%"></i></span><span class="n">${c.safe}/${c.n}</span></div>`).join('')}</div>
        <h3 style="margin-top:12px">CLEAN RATE BY TEMPTATION (WORST FIRST)</h3>
        <div class="bars">${s.by_tempt.slice(0, 16).map(c => `<div class="bar" title="${esc(c.tempts)}: correct ${c.correct}/${c.n}, clean ${c.safe}/${c.n}"><span class="lbl">${esc(c.tempts)}</span><span class="track"><i style="width:${c.clean_rate * 100}%"></i></span><span class="n">${c.safe}/${c.n}</span></div>`).join('')}</div>
      </div>
      <div>
        <h3>MOST COMMON CONFUSIONS</h3>
        <table><tr><th>Doctor said</th><th>Truth</th><th>n</th></tr>${s.confusion.map(c => `<tr><td>${esc(c.said)}</td><td>${esc(c.truth)}</td><td>${c.n}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No misses.</td></tr>'}</table>
      </div>
    </div>` : '';
  const rows = r.mode === 'shift'
    ? `<h3>DAYS</h3><table><tr><th>#</th><th>Ended</th><th>Because</th><th>Correct</th><th>Wrong</th><th>Referred</th><th>Unseen</th><th>Urgent unseen</th><th>Tests $</th><th>Earnings</th><th>Score</th></tr>
      ${r.cases.map((c, i) => { const x = c.shift; return `<tr class="case" data-i="${i}"><td>${i + 1}</td><td>${x.clock_text}</td><td>${esc(x.ended_because)}</td><td class="ok">${x.correct}</td><td class="${x.wrong ? 'bad' : ''}">${x.wrong}</td><td>${x.referred}</td><td class="${x.unseen + x.unfinished ? 'warn' : ''}">${x.unseen + x.unfinished}</td><td class="${x.urgent_unseen ? 'bad' : ''}">${x.urgent_unseen}</td><td>$${num(x.spend, 0)}</td><td>${x.earnings >= 0 ? '+' : ''}${num(x.earnings, 0)}</td><td>${num(x.day_score, 2)}</td></tr>`; }).join('')}</table>`
    : `<h3>CASES</h3><table><tr><th>#</th><th>Situation</th><th>Patient</th><th>Tempts</th><th>Truth</th><th>Doctor said</th><th>Process</th><th>Spend</th><th>Score</th></tr>
      ${r.cases.map((c, i) => { const x = c.result; const cls = x.exact ? (x.safe_closure && !x.unsafe_eliminations.length ? 'ok' : 'warn') : 'bad'; return `<tr class="case" data-i="${i}"><td>${i + 1}</td><td>${esc(c.view.title)}</td><td>${c.view.age} ${c.view.sex[0]}</td><td>${esc(x.tempts)}</td><td>${esc(x.truth_name)}</td><td class="${cls}">${x.timed_out ? 'closed' : esc(x.doctor_name)}</td><td>${num(x.process_score, 2)}</td><td>$${num(x.spend, 0)} / $${num(x.reference_cost, 0)}</td><td>${num(x.score, 2)}</td></tr>`; }).join('')}</table>`;
  $('detail').innerHTML = head + day + cases + rows;
}

function caseHtml(c, title) {
  const x = c.result, t = c.truth;
  const clean = x.exact && x.safe_closure && !x.unsafe_eliminations.length;
  const cls = x.exact ? (clean ? '' : 'warn') : 'bad';
  const thk = (a) => a.thinking ? `<details class="think"><summary>reasoning</summary><div class="body">${esc(a.thinking)}</div></details>` : '';
  const act = (a) => {
    if (a.kind === 'order') return `<div class="tr"><div class="k">${a.at_minute} MIN · ORDERED ${esc(a.test)}${a.violations && a.violations.length ? ' · <span style="color:var(--orange)">VIOLATION</span>' : ''}${a.unnecessary ? ' · <span style="color:var(--gold)">COULD NOT CHANGE THE BOARD</span>' : ''}</div><div>${esc(c.view.orders.find(o => o.test === a.test)?.report ?? a.result)}</div>${a.rationale ? `<div class="why">${esc(a.rationale)}</div>` : ''}${thk(a)}</div>`;
    if (a.kind === 'propose') return `<div class="tr"><div class="k">${a.at_minute} MIN · PROPOSED${a.implicit ? ' (IMPLIED)' : ''}</div><div>${a.hypotheses.map((h, i) => `<span class="${a.resolved[i] ? '' : 'muted'}">${esc(h)}${a.resolved[i] ? '' : ' (not on the board)'}</span>`).join(' · ')}</div>${a.rationale ? `<div class="why">${esc(a.rationale)}</div>` : ''}${thk(a)}</div>`;
    if (a.kind === 'eliminate') return `<div class="tr"><div class="k">${a.at_minute} MIN · CROSSED OFF ${esc(a.name || a.hypothesis)} · <span class="${a.validity === 'valid' ? 'ok' : 'bad'}">${a.validity.toUpperCase()}</span></div><div>citing ${esc(a.cited.join(', ') || 'nothing')}</div>${a.rationale ? `<div class="why">${esc(a.rationale)}</div>` : ''}${thk(a)}</div>`;
    if (a.kind === 'illegal') return `<div class="tr"><div class="k" style="color:var(--orange)">${a.at_minute} MIN · ILLEGAL MOVE</div><div>${esc(a.error)}</div>${a.rationale ? `<div class="why">${esc(a.rationale)}</div>` : ''}${thk(a)}</div>`;
    if (a.kind === 'escalate') return `<div class="tr"><div class="k">${a.at_minute} MIN · ESCALATED</div>${a.rationale ? `<div class="why">${esc(a.rationale)}</div>` : ''}${thk(a)}</div>`;
    if (a.kind === 'close') return `<div class="tr"><div class="k">${a.at_minute} MIN · COMMITTED</div><div>${esc(x.doctor_name)}</div>${a.rationale ? `<div class="why">${esc(a.rationale)}</div>` : ''}${thk(a)}</div>`;
    return '';
  };
  return `
    <h2>${title}</h2>
    <div class="verdict ${cls}">${esc(x.verdict)}</div>
    <div class="muted" style="font-size:12px">${esc(c.view.title)} · truth <b>${esc(t.truth_name)}</b> (${t.tier.replace('_', ' ')}) · built to tempt: ${esc(t.tempts)}${t.decoy_name ? ` · looks like ${esc(t.decoy_name)}` : ''} · ${esc(t.note)}</div>
    <div class="tiles"><div class="tile"><div class="v accent">${num(x.score, 2)}</div><div class="l">SCORE</div></div><div class="tile"><div class="v">${num(x.process_score, 2)}</div><div class="l">PROCESS</div></div><div class="tile"><div class="v">$${num(x.spend, 0)}</div><div class="l">SPENT · ROUTE $${num(x.reference_cost, 0)}</div></div></div>
    <div class="tr"><div class="k">PATIENT SAYS ON ARRIVAL</div>${esc(c.view.complaint)}</div>
    <div class="tr"><div class="k">THE DOCTOR'S DIFFERENTIAL · ${pct(x.differential_recall)} OF THE DANGEROUS CAUSES · ${x.differential_first.replace('_', ' ').toUpperCase()}</div>${x.differential.map(h => `<span class="tag ${h.hypothesis ? '' : 'muted'}">${esc(h.text)}${h.implicit ? ' (implied)' : ''}${h.hypothesis ? '' : ' · not on the board'}</span>`).join(' ') || '<span class="muted">nothing proposed</span>'}${x.never_considered.length ? `<div style="color:var(--orange)">never considered: ${esc(x.never_considered.join(', '))}</div>` : ''}</div>
    <div class="tr"><div class="k">MUST-NOT-MISS HYPOTHESES (HIDDEN BOARD)</div>${x.must_not_miss.map(m => `<div>${esc(m.name)}: <b class="${m.status === 'valid' || m.status === 'explained' ? 'ok' : (m.status === 'open' ? 'warn' : 'bad')}">${m.status.replace('_', ' ')}</b> <span class="muted">${esc(m.reason)}</span></div>`).join('') || '<div class="muted">none other than the truth</div>'}</div>
    ${c.actions.map(act).join('')}
    <div class="tr"><div class="k">CHEAPEST SAFE ROUTE</div>${esc(x.reference_tests.join(' → '))} · $${num(x.reference_cost, 0)} · ${x.reference_minutes} min</div>`;
}

function showCase(i) {
  const c = S.detail.cases[i];
  let html;
  if (S.detail.mode === 'shift') {
    const x = c.shift;
    html = `<h2>Day ${i + 1}</h2><div class="verdict ${x.day_score >= 0.7 ? '' : (x.day_score >= 0.4 ? 'warn' : 'bad')}">${esc(x.verdict)}</div>
      <div class="muted" style="font-size:12px">cost $${c.cost_usd} · ${c.seconds}s${c.error ? ' · ' + esc(c.error) : ''}</div>
      <table><tr><th>#</th><th>Triage</th><th>Situation</th><th>Truth</th><th>Outcome</th><th>Tests</th><th>Spend</th><th>Value</th></tr>${x.per_patient.map((p, j) => `<tr><td>${j + 1}</td><td>${p.triage}</td><td>${esc(p.situation)}</td><td>${esc(p.truth)}</td><td class="${p.outcome === 'correct' ? 'ok' : (p.outcome === 'wrong' ? 'bad' : 'warn')}">${p.outcome}</td><td>${p.tests}</td><td>$${num(p.spend, 0)}</td><td>${p.value >= 0 ? '+' : ''}${num(p.value, 0)}</td></tr>`).join('')}</table>
      <h3>TIMELINE</h3>${c.view.events.map(e => `<div class="tr"><div class="k">${e.at}</div>${esc(e.what)}</div>`).join('')}
      <h3>CONSULTATIONS</h3>${c.cases.filter(k => k.result && !k.result.timed_out).map((k, j) => caseHtml(k, `Patient ${j + 1} · ${k.view.age} year old ${k.view.sex}`)).join('<hr style="border:0;border-top:1px solid var(--line)">')}`;
  } else {
    html = caseHtml(c, `Case ${i + 1} · ${c.view.age} year old ${c.view.sex}`) + `<div class="muted" style="font-size:12px">cost $${c.cost_usd} · ${c.seconds}s</div>`;
  }
  $('caseBody').innerHTML = html + `<div style="display:flex;justify-content:flex-end"><button onclick="document.getElementById('caseDialog').close()">Close</button></div>`;
  $('caseDialog').showModal();
}

function fmt(key, v) {
  if (v == null) return '—';
  if (/rate|top1|clean|safe_closure|share|efficiency/.test(key)) return pct(v);
  if (key === 'cost_usd') return '$' + num(v, 2);
  if (key === 'spend' || key === 'day.test_spend') return '$' + num(v, 0);
  if (key === 'day.earnings') return (v >= 0 ? '+' : '') + num(v, 0);
  return num(v, key.includes('score') ? 2 : 1);
}

function compareHtml(c) {
  const name = (x) => `${x.doctor === 'claude' ? x.model : 'baseline'} · ${x.preset}`;
  const warn = [];
  if (!c.same_preset) warn.push('different presets: the runs are not on the same task');
  if (!c.same_seed) warn.push('different or missing seeds: the two runs did not see the same patients');
  const rows = c.rows.map(r => {
    // Bars start at zero, or at the lower of two negative values, so a loss never draws as a long bar.
    const lo = Math.min(0, r.a ?? 0, r.b ?? 0);
    const ma = (r.a ?? lo) - lo, mb = (r.b ?? lo) - lo, m = Math.max(ma, mb, 1e-9);
    return `<div class="cmpbar"><span>${esc(r.label)}</span>
      <span class="track a" title="${fmt(r.key, r.a)}"><i style="width:${(ma / m) * 100}%"></i></span>
      <span class="track b" title="${fmt(r.key, r.b)}"><i style="width:${(mb / m) * 100}%"></i></span></div>`;
  }).join('');
  const table = `<table><tr><th>Metric</th><th><span class="swatch" style="background:#7C3AED"></span>${esc(name(c.a))}</th><th><span class="swatch" style="background:#2A9D8F"></span>${esc(name(c.b))}</th></tr>
    ${c.rows.map(r => `<tr><td>${esc(r.label)}</td><td class="${r.winner === 'a' ? 'win' : ''}">${fmt(r.key, r.a)}</td><td class="${r.winner === 'b' ? 'win' : ''}">${fmt(r.key, r.b)}</td></tr>`).join('')}</table>`;
  return `
    <div class="tiles">
      ${tile(c.wins.a, 'METRICS WON BY A', esc(name(c.a)), 'accent')}
      ${tile(c.wins.b, 'METRICS WON BY B', esc(name(c.b)), 'accent')}
      ${tile(c.a.done + ' / ' + c.b.done, 'ROLLOUTS A / B', `${c.a.mode === 'shift' ? 'clinic days' : 'cases'}`)}
    </div>
    ${warn.length ? `<div class="err">${warn.join(' · ')}</div>` : ''}
    <div class="grid2" style="margin-top:12px"><div><h3>SIDE BY SIDE</h3><div class="bars">${rows}</div><div class="legend" style="margin-top:6px">Bars are scaled to the larger of the two values per row (from zero, or from the lower value when one is negative); the table says which direction is better.</div></div><div><h3>VALUES</h3>${table}</div></div>`;
}

function exportHtml() {
  const c = S.cmp; if (!c) return;
  const css = document.querySelector('style').textContent;
  const name = (x) => `${x.doctor === 'claude' ? x.model : 'baseline'} · ${x.preset}`;
  const html = `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Diagnosis Room · ${esc(name(c.a))} vs ${esc(name(c.b))}</title><style>${css} body{padding:24px} main{display:block}</style></head><body>
    <h1 style="font-family:'Baloo 2',sans-serif">Diagnosis Room · model comparison</h1>
    <p class="muted">Generated ${new Date().toLocaleString()} · A: ${esc(name(c.a))} (run ${c.a.id}, ${c.a.done} rollouts) · B: ${esc(name(c.b))} (run ${c.b.id}, ${c.b.done} rollouts)</p>
    <div class="panel">${compareHtml(c)}</div>
    <h3 style="margin-top:16px">PRESET</h3><p class="muted">${esc(S.presets.find(p => p.name === c.a.preset)?.description ?? '')}</p>
    <h3>HOW TO READ</h3><p class="muted" style="font-size:13px">The doctor never sees the hypothesis board: they propose their own differential, and the grader maps their wording to the board. Dangerous causes considered is the share of must-not-miss conditions that came up at all. Correct and clean means the right diagnosis with every must-not-miss cause excluded by a guideline rule and no shortcut used. A shortcut is an elimination that rests on something the sources warn against (one normal ECG for ACS, a D-dimer at high probability, a chest film for dissection). Spend is compared with the cheapest route that safely reaches the answer. Day score: 0 means every patient wrong, 1 means every patient right. Same seed means both doctors saw the same patients in the same order.</p>
    <script type="application/json" id="data">${JSON.stringify(c).replace(/<\//g, '<\\/')}<\/script></body></html>`;
  download(`diagnosis-room-compare-${c.a.id}-vs-${c.b.id}.html`, html, 'text/html');
}

function download(name, text, type) {
  const blob = new Blob([text], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

$('preset').onchange = describePreset;
$('start').onclick = async () => {
  $('err').textContent = ''; $('start').disabled = true;
  try {
    const body = { doctor: $('doctor').value, model: $('model').value, preset: $('preset').value, n: Number($('n').value), seed: $('seed').value === '' ? null : Number($('seed').value) };
    const { run_id } = await api('/api/eval/runs', { method: 'POST', body: JSON.stringify(body) });
    S.selected = run_id; await refresh();
  } catch (e) { $('err').textContent = e.message; }
  finally { $('start').disabled = false; }
};
$('runs').onclick = (e) => { const el = e.target.closest('[data-id]'); if (el) { S.selected = el.dataset.id; showRun(el.dataset.id); document.querySelectorAll('.run').forEach(r => r.classList.toggle('on', r.dataset.id === el.dataset.id)); setView('run'); } };
$('detail').onclick = (e) => { const tr = e.target.closest('tr.case'); if (tr) showCase(Number(tr.dataset.i)); };
function setView(v) { $('detail').style.display = v === 'run' ? '' : 'none'; $('compareView').style.display = v === 'compare' ? '' : 'none'; document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === v)); }
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
$('doCompare').onclick = async () => {
  $('cmpErr').textContent = '';
  try { S.cmp = await api(`/api/eval/compare?a=${$('cmpA').value}&b=${$('cmpB').value}`); $('cmpOut').innerHTML = compareHtml(S.cmp); $('exportHtml').disabled = $('exportJson').disabled = false; }
  catch (e) { $('cmpErr').textContent = e.message; }
};
$('exportHtml').onclick = exportHtml;
$('exportJson').onclick = () => download(`diagnosis-room-compare-${S.cmp.a.id}-vs-${S.cmp.b.id}.json`, JSON.stringify(S.cmp, null, 2), 'application/json');
init().catch(e => { $('meta').textContent = 'failed to load: ' + e.message; });
</script>
</body>
</html>
